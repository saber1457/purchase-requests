# يبقي مشروع Supabase المجاني نشطًا: خطة Supabase المجانية توقف المشروع
# بعد 7 أيام بدون أي طلب لقاعدة البيانات. هذه الوظيفة تعمل ping
# للجدول كل 3 أيام فلا يتوقف المشروع أبدًا. المفتاح المستخدم هو
# المفتاح العام نفسه الموجود في التطبيق (آمن للظهور علنًا).
name: keep-supabase-alive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" \
            "https://wkrasfnkozbqnhkosngd.supabase.co/rest/v1/purchase_requests?select=id&limit=1" \
            -H "apikey: sb_publishable_Vla_hMPIlRl46MNPSrhdgA_ouae6ycI"
